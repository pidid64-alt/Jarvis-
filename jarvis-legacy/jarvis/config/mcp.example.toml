# Серверы MCP (Model Context Protocol) — внешние инструменты для Jarvis.
#
# Файл лежит рядом с config.toml. Jarvis подключается к серверам только тогда,
# когда фразу не разобрал ни один навык и понадобилась модель: на слабой машине
# это экономит память. Сервер, к которому давно не обращались, гасится сам
# (idle_seconds).
#
# Проверить, что видно:  jarvis mcp
# Вызвать инструмент:    jarvis mcp --call имя.инструмент --arg ключ=значение
#
# Ключи серверов (токены) храните в переменных окружения или в .env, а в файле
# пишите ссылку: ${MCP_GITHUB_TOKEN}. Значение в файле Jarvis не примет.

[mcp]
enabled = true
# сколько инструментов брать с одного сервера (больше — длиннее запрос к модели)
max_tools_per_server = 25

# ---------------------------------------------------------------- пример: stdio
# Jarvis сам запускает программу сервера и говорит с ней через stdin/stdout.
# [[server]]
# name = "files"
# description = "Доступ к папке с документами"
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-filesystem", "{home}/Documents"]
# enabled = true
# # спрашивать подтверждение перед каждым вызовом (по умолчанию — только там,
# # где у инструмента есть аргументы или он помечен как опасный)
# confirm = false
# timeout_seconds = 20
# idle_seconds = 600
# env = { LOG_LEVEL = "info" }

# ---------------------------------------------------------------- пример: HTTP
# Сервер уже где-то работает и отвечает по адресу (Streamable HTTP).
# [[server]]
# name = "home"
# url = "http://localhost:8080/mcp"
# headers = { Authorization = "Bearer ${MCP_HOME_TOKEN}" }
# enabled = true
# timeout_seconds = 30
