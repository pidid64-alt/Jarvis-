# Адресная книга Jarvis: кому он может писать.
# Файл лежит рядом с настройками: точный путь покажет «jarvis messengers».
# Секретов здесь нет — только имена и адреса. Пустые поля можно не писать.

[[contact]]
name = "Артём"
telegram = "123456789"          # chat_id: узнать можно у бота @userinfobot
email = "artem@example.com"
whatsapp = "+77001234567"       # телефон; wacli сам найдёт чат по имени

[[contact]]
name = "Мама"
telegram = "987654321"
whatsapp = "+77007654321"

