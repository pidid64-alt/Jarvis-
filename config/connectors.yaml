# Коннекторы мессенджеров/соцсетей.

telegram:
  enabled: true
  session_file: data/sessions/telegram.session
  mode: read_only        # MVP: только чтение. Варианты будущего: draft | auto
  allowed_chats: []      # задел для режимов draft/auto (этап 2)

gmail:
  enabled: true
  mode: draft          # read_only — только чтение; draft — отправка писем
                       # через подтверждение кнопками (кнопки ✅/❌ в боте)
