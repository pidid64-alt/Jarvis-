[project]
name = "jarvis-assistant"
version = "0.1.0"
description = "«Джарвис» — личный ИИ-ассистент: агентное ядро, MCP, веб-парсинг, коннекторы мессенджеров"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2",
    "httpx>=0.27",
    "tenacity>=8.2",
    "trafilatura>=1.12",
    "telethon>=1.36",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "aiosqlite>=0.20",
    "aiolimiter>=1.1",
    "numpy>=1.26",
    "fastembed>=0.4",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
jarvis = "jarvis.interfaces.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# BLE001/S110: граничный код агента (сторонние библиотеки, потоки, коннекторы)
# намеренно ловит широкие исключения, чтобы цикл агента не падал.
ignore = ["BLE001", "S110"]
