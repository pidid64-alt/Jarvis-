[project]
name = "jarvis-assistant"
version = "1.0.0"
description = "Легкий локальный ассистент: голос, текст, GUI, навыки-плагины"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jarvis" }]
# Обязательных внешних зависимостей нет: ядро работает на стандартной библиотеке.
dependencies = []

[project.optional-dependencies]
# Голос: распознавание речи, синтез, микрофон, слово-активатор
voice = [
  "piper-tts[http]==1.2.0",
  "webrtcvad-wheels==2.0.14",
  "sounddevice==0.4.7",
  "numpy==1.26.4",
]
wakeword = ["openwakeword==0.6.0"]
# Поиск в интернете (без него работает встроенный запасной поиск)
search = ["ddgs==9.0.0"]
# Значок в трее и иконки
tray = ["pystray==0.19.5", "Pillow==10.4.0"]
# Разработка и тесты
dev = ["pytest==8.3.3"]

[project.scripts]
jarvis = "jarvis.interfaces.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
  "jarvis",
  "jarvis.core",
  "jarvis.interfaces",
  "jarvis.platform",
  "jarvis.providers",
  "jarvis.skills",
]

[tool.setuptools.package-data]
jarvis = ["config/*.toml", "config/i18n/*.json", "skills/*/skill.json", "skills/*/handler.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
